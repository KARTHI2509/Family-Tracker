name: FamilyTracker CI/CD Quality Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build & Test Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Backend Verification
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Automated Test Suite
        working-directory: ./backend
        env:
          PORT: 3099
          JWT_SECRET: ci_test_secret_key_familytracker_automated_tests_12345
          NODE_ENV: test
        run: npm test

      # Frontend Verification
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify Frontend Production Build
        working-directory: ./frontend
        env:
          VITE_API_URL: /api
          VITE_SOCKET_URL: /
        run: npm run build
